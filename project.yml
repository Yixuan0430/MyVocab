name: Lexikos
options:
  bundleIdPrefix: com.yixuanwu
  deploymentTarget: { macOS: "14.0", iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: BGM8P5U985
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.2.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: MyVocab
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CLOUDKIT"
packages:
  ZIPFoundation: { url: https://github.com/weichsel/ZIPFoundation.git, exactVersion: 0.9.20 }
  zstd: { url: https://github.com/facebook/zstd.git, exactVersion: 1.5.7 }
targets:
  Lexikos-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/Lexikos
        excludes: ["iOS/**"]
      - path: Resources/Lexikos.icns
        buildPhase: resources
      - path: scripts/myvocab-mcp.py
        buildPhase: resources
    dependencies:
      - { package: ZIPFoundation }
      - { package: zstd, product: libzstd }
      - { target: LexikosWidgets-macOS }
    info:
      path: Config/Lexikos-macOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: Lexikos
        CFBundleURLTypes: [{ CFBundleURLName: com.yixuanwu.lexikos, CFBundleURLSchemes: [lexikos, myvocab] }]
    settings:
      base:
        PRODUCT_NAME: MyVocab
        PRODUCT_BUNDLE_IDENTIFIER: com.yixuanwu.lexikos
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleIconFile: Lexikos
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Lexikos-macOS.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Lexikos-macOS-Release.entitlements
          ARCHS: "$(ARCHS_STANDARD)"
          ONLY_ACTIVE_ARCH: NO
  Lexikos-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Lexikos
        excludes: ["macOS/**"]
      - Resources/Assets.xcassets
    dependencies:
      - { package: ZIPFoundation }
      - { package: zstd, product: libzstd }
      - { target: LexikosWidgets-iOS }
    settings:
      base:
        PRODUCT_NAME: MyVocab
        PRODUCT_BUNDLE_IDENTIFIER: com.yixuanwu.lexikos
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Config/Lexikos-iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes: [{ CFBundleURLName: com.yixuanwu.lexikos, CFBundleURLSchemes: [lexikos, myvocab] }]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anki deck
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.ankiweb.apkg]
          - CFBundleTypeName: Word list
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text, public.tab-separated-values-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.ankiweb.apkg
            UTTypeDescription: Anki deck package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification: { public.filename-extension: [apkg] }
    entitlements:
      path: Config/Lexikos-iOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.yixuanwu.lexikos]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.yixuanwu.lexikos
        aps-environment: development
        com.apple.security.application-groups: [group.com.yixuanwu.lexikos]
  LexikosWidgets-iOS:
    type: app-extension
    platform: iOS
    sources: &widgetSources
      - Sources/Widgets
      - Sources/Lexikos/WidgetData.swift
      - Sources/Lexikos/Theme.swift
    settings:
      base:
        PRODUCT_NAME: LexikosWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.yixuanwu.lexikos.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: MyVocab
    info:
      path: Config/LexikosWidgets-iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    entitlements:
      path: Config/LexikosWidgets-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yixuanwu.lexikos]
  LexikosWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_NAME: LexikosWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.yixuanwu.lexikos.widgets
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyVocab
      configs:
        Release:
          ARCHS: "$(ARCHS_STANDARD)"
          ONLY_ACTIVE_ARCH: NO
    info:
      path: Config/LexikosWidgets-macOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    entitlements:
      path: Config/LexikosWidgets-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [BGM8P5U985.com.yixuanwu.lexikos]
