disabled_rules:
  - colon
  - comma
  - control_statement
  - cyclomatic_complexity
  - function_parameter_count
  - identifier_name
  - large_tuple
  - leading_whitespace
  - line_length
  - multiple_closures_with_trailing_closure
  - nesting
  - opening_brace
  - return_arrow_whitespace
  - statement_position
  - todo
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - type_body_length
  - type_name
  - vertical_parameter_alignment
  - vertical_whitespace

file_length:
  warning: 500
  error: 600

function_body_length:
  warning: 100
  error: 120

force_cast: warning
force_try: error
